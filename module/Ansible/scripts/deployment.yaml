---
 - hosts: webservers
   become: true
   vars_files:
    - ansible_vars_file.yml
   tasks:
   - name: Stop any container running
     command: docker stop appContainer
     ignore_errors: yes
   - name: Remove stopped container
     command: docker rm appContainer
     ignore_errors: yes
   - name: Remove docker image
     command: docker rmi "{{ NEXUS_IP }}"/petclinicapps:latest
     ignore_errors: yes
   - name: Pull docker image from nexus and create a container
     shell: |
       NEXUS_PASSWORD=$(/usr/local/bin/aws ssm get-parameter --name "{{ NEXUS_PASSWORD_PARAM }}" --with-decryption --query Parameter.Value --output text --region "{{ AWS_REGION }}")
       echo "$NEXUS_PASSWORD" | docker login --username=admin --password-stdin {{ NEXUS_IP }}
       docker pull {{ NEXUS_IP }}/petclinicapps:latest
       docker run -d --name appContainer -p 8080:8080 {{ NEXUS_IP }}/petclinicapps:latest
     no_log: true
